name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Run PHPUnit tests
        run: vendor/bin/pest

      - name: Run npm test/build
        run: npm run build

      - name: Check mergeability
        run: |
          git fetch origin
          git merge-base --is-ancestor HEAD origin/main && echo "Can merge" || echo "Cannot merge"